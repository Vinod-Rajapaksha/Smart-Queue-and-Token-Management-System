services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test:
          [
            "CMD",
            "node",
            "-e",
            "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend-web:
    build:
      context: ./frontend-web
      args:
        VITE_API_BASE_URL: http://127.0.0.1:5000/api
        VITE_SOCKET_BASE_URL: http://127.0.0.1:5000
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
